openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: House Price Prediction Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User profile operations
  - name: predictions
    description: House price prediction operations
  - name: chat
    description: AI chatbot operations
  - name: stats
    description: Statistics and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /predictions:
    get:
      operationId: listPredictions
      tags: [predictions]
      summary: List prediction history for current user
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of predictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionListResponse"
    post:
      operationId: createPrediction
      tags: [predictions]
      summary: Predict house price using ML models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionInput"
      responses:
        "201":
          description: Prediction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /predictions/{id}:
    get:
      operationId: getPrediction
      tags: [predictions]
      summary: Get a specific prediction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prediction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePrediction
      tags: [predictions]
      summary: Delete a prediction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /predictions/stats/summary:
    get:
      operationId: getPredictionStats
      tags: [stats]
      summary: Get prediction statistics for current user
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionStats"

  /predictions/stats/market:
    get:
      operationId: getMarketInsights
      tags: [stats]
      summary: Get market-wide pricing insights and trends
      responses:
        "200":
          description: Market insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketInsights"

  /chat:
    get:
      operationId: listChatHistory
      tags: [chat]
      summary: Get chat history for current session
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the AI house price assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/clear:
    post:
      operationId: clearChat
      tags: [chat]
      summary: Clear chat history
      responses:
        "200":
          description: Chat cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        occupation:
          type: ["string", "null"]
      required:
        - firstName
        - lastName
        - email
        - password

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    User:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        occupation:
          type: ["string", "null"]
        totalPredictions:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - firstName
        - lastName
        - email
        - totalPredictions
        - createdAt

    UpdateUserBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        occupation:
          type: ["string", "null"]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user
        - message

    PredictionInput:
      type: object
      properties:
        location:
          type: string
        area:
          type: number
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        floors:
          type: integer
        yearBuilt:
          type: integer
        hasGarage:
          type: boolean
        hasGarden:
          type: boolean
        hasPool:
          type: boolean
        nearSchool:
          type: boolean
        nearHospital:
          type: boolean
        nearMall:
          type: boolean
        condition:
          type: string
          enum: [poor, fair, good, excellent]
        propertyType:
          type: string
          enum: [apartment, house, villa, townhouse, studio]
        model:
          type: string
          enum: [linear, ridge, random_forest]
      required:
        - location
        - area
        - bedrooms
        - bathrooms
        - floors
        - yearBuilt
        - condition
        - propertyType

    Prediction:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        location:
          type: string
        area:
          type: number
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        floors:
          type: integer
        yearBuilt:
          type: integer
        hasGarage:
          type: boolean
        hasGarden:
          type: boolean
        hasPool:
          type: boolean
        nearSchool:
          type: boolean
        nearHospital:
          type: boolean
        nearMall:
          type: boolean
        condition:
          type: string
        propertyType:
          type: string
        modelUsed:
          type: string
        predictedPrice:
          type: number
        linearPrice:
          type: number
        ridgePrice:
          type: number
        randomForestPrice:
          type: number
        confidenceScore:
          type: number
        priceRange:
          $ref: "#/components/schemas/PriceRange"
        featureImportance:
          $ref: "#/components/schemas/FeatureImportance"
        createdAt:
          type: string
      required:
        - id
        - location
        - area
        - bedrooms
        - bathrooms
        - floors
        - yearBuilt
        - hasGarage
        - hasGarden
        - hasPool
        - nearSchool
        - nearHospital
        - nearMall
        - condition
        - propertyType
        - modelUsed
        - predictedPrice
        - linearPrice
        - ridgePrice
        - randomForestPrice
        - confidenceScore
        - priceRange
        - featureImportance
        - createdAt

    PriceRange:
      type: object
      properties:
        low:
          type: number
        high:
          type: number
      required:
        - low
        - high

    FeatureImportance:
      type: object
      properties:
        area:
          type: number
        location:
          type: number
        bedrooms:
          type: number
        bathrooms:
          type: number
        yearBuilt:
          type: number
        amenities:
          type: number
        condition:
          type: number
      required:
        - area
        - location
        - bedrooms
        - bathrooms
        - yearBuilt
        - amenities
        - condition

    PredictionListResponse:
      type: object
      properties:
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/Prediction"
        total:
          type: integer
      required:
        - predictions
        - total

    PredictionStats:
      type: object
      properties:
        totalPredictions:
          type: integer
        averagePrice:
          type: number
        highestPrice:
          type: number
        lowestPrice:
          type: number
        mostUsedModel:
          type: string
        favoriteLocation:
          type: ["string", "null"]
        accuracyScore:
          type: number
      required:
        - totalPredictions
        - averagePrice
        - highestPrice
        - lowestPrice
        - mostUsedModel
        - accuracyScore

    MarketInsights:
      type: object
      properties:
        averagePriceByLocation:
          type: array
          items:
            $ref: "#/components/schemas/LocationPrice"
        averagePriceByType:
          type: array
          items:
            $ref: "#/components/schemas/TypePrice"
        modelAccuracy:
          $ref: "#/components/schemas/ModelAccuracy"
        totalPredictionsGlobal:
          type: integer
        priceDistribution:
          type: array
          items:
            $ref: "#/components/schemas/PriceDistribution"
      required:
        - averagePriceByLocation
        - averagePriceByType
        - modelAccuracy
        - totalPredictionsGlobal
        - priceDistribution

    LocationPrice:
      type: object
      properties:
        location:
          type: string
        avgPrice:
          type: number
        count:
          type: integer
      required:
        - location
        - avgPrice
        - count

    TypePrice:
      type: object
      properties:
        propertyType:
          type: string
        avgPrice:
          type: number
        count:
          type: integer
      required:
        - propertyType
        - avgPrice
        - count

    ModelAccuracy:
      type: object
      properties:
        linear:
          type: number
        ridge:
          type: number
        randomForest:
          type: number
      required:
        - linear
        - ridge
        - randomForest

    PriceDistribution:
      type: object
      properties:
        range:
          type: string
        count:
          type: integer
      required:
        - range
        - count

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
      required:
        - id
        - role
        - content
        - createdAt

    ChatHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - messages

    ChatMessageInput:
      type: object
      properties:
        message:
          type: string
        sessionId:
          type: ["string", "null"]
      required:
        - message

    ChatResponse:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/ChatMessage"
        sessionId:
          type: string
      required:
        - message
        - sessionId
